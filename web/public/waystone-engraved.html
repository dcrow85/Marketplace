<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — light carved out of the dark</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#000}
  body{font:12.5px "IBM Plex Mono",monospace;color:#8c8570;display:grid;place-items:center;padding:22px 12px 48px}
  body{color:#8c8570}
  h1{font:italic 500 21px "Spectral",serif;color:#f0e9d8;margin:0 0 5px;text-align:center}
  .sub{text-align:center;margin-bottom:22px;opacity:.8}
  .sub b{color:#e0a83c;font-weight:500}
  .col{display:grid;gap:20px;max-width:1280px;width:100%}
  figure{margin:0;border:1px solid rgba(224,168,60,.22);border-radius:8px;overflow:hidden;background:#000;
    box-shadow:0 16px 44px rgba(0,0,0,.8)}
  img{width:100%;display:block}
  figcaption{padding:12px 14px 14px;font:italic 500 13.5px/1.55 "Spectral",serif;color:#a1997f}
  figcaption b{display:block;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#e0a83c;letter-spacing:.08em;margin-bottom:4px}
</style></head><body>
<h1>Light carved out of the dark</h1>
<div class="sub">white-line wood engraving · solid black ground · one <b>gold</b> · beings as rim-lit silhouettes</div>
<div class="col">
  <figure><img src="waystone-art/eng-window.png" alt="a being examining a card by lamplight" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the window</b>A gold rectangle of lamplight, and in it a small being holding a card nearly as tall as itself up to the lamp. Ferns picked out in white line, a few fronds catching gold.</figcaption></figure>
  <figure><img src="waystone-art/eng-village.png" alt="the village under giant ferns" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the village</b>Cabins with gold windows under arching ferns, a pine cone the size of a house, two rim-lit silhouettes in the lane with a small light between them.</figcaption></figure>
  <figure><img src="waystone-art/eng-stone.png" alt="the waystone" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the waystone</b>Contour-cut granite, moss stippled at the shoulder, instrument bands and a sensor housing in precise white line — and the marks as plain gold TALLY STROKES. A count, not a language. One resident stands at its foot.</figcaption></figure>
</div>
</body></html>
