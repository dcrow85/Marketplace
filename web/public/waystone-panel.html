<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — painted panel, foxfire green</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#0c0e0d}
  body{font:12.5px "IBM Plex Mono",monospace;color:#7e857c;display:grid;place-items:center;padding:22px 12px 48px}
  h1{font:italic 500 21px "Spectral",serif;color:#e6ece4;margin:0 0 5px;text-align:center}
  .sub{text-align:center;margin-bottom:22px;opacity:.85}
  .sub b{color:#8ceaa8;font-weight:500}
  .col{display:grid;gap:20px;max-width:1240px;width:100%}
  figure{margin:0;border:1px solid rgba(140,234,168,.18);border-radius:8px;overflow:hidden;background:#111;
    box-shadow:0 16px 44px rgba(0,0,0,.7)}
  img{width:100%;display:block}
  figcaption{padding:12px 14px 14px;font:italic 500 13.5px/1.55 "Spectral",serif;color:#9aa396}
  figcaption b{display:block;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#8ceaa8;letter-spacing:.08em;margin-bottom:4px}
</style></head><body>
<h1>Painted panel, foxfire green</h1>
<div class="sub">big calm shapes · painted wood · flat black · one <b>bioluminescent green</b> · green is unformed, black is formed &middot; no humans anywhere</div>
<div class="col">
  <figure><img src="waystone-art/simple-sheet.png" alt="simple character sheet, round ears" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>simpler &mdash; round ears</b>Five poses, tiny hands, green dot eyes, three ticks on the chest. Cutest of the three, and the most generic: those ears could belong to anybody&rsquo;s mascot.</figcaption></figure>
  <figure><img src="waystone-art/simple-spiral.png" alt="simple character sheet, spiral ears" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>simpler &mdash; spiral ears</b>Unmistakably ours, but the curls flattened against the head and read closer to horns than ears. Distinctive, slightly less huggable.</figcaption></figure>
  <figure><img src="waystone-art/simple-pair.png" alt="the two states, very simple" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>too far</b>Simplified until the ears vanished entirely. Adorable &mdash; and anonymous. A useful edge of the range.</figcaption></figure>
  <figure><img src="waystone-art/burrow-home.png" alt="inside a collector's burrow" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>a home</b>Shelves built into every turn of the coil &mdash; cards standing in sleeves, archive boxes, jars of kept things, tools on pegs, a rolled mat &mdash; and the vein blooming green out of the floor, lighting the spiral from below. Someone lives here.</figcaption></figure>
  <figure><img src="waystone-art/hero2.png" alt="a resident standing before the volcano" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>upright, with hands</b>Standing on two legs, hands at its sides, green eye and chest tally lit, small on the rise with the mountain vast behind. A creature that can hold what it collects.</figcaption></figure>
  <figure><img src="waystone-art/hero-volcano.png" alt="a resident before the volcano" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the hero frame</b>Green eye lit, tally marks on the shoulder, the hatched hills rolling away and the mountain breathing green behind. Character and world at the right sizes, at last.</figcaption></figure>
  <figure><img src="waystone-art/burrow.png" alt="a spiral burrow with light rising from it" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the burrow</b>One structure, not two: a stone coil descending toward the vein, steps following it down, open at the top so the light rises out in a column. At night the plain is full of quiet green shafts.</figcaption></figure>
  <figure><img src="waystone-art/spiral-village.png" alt="a settlement of spiral dwellings" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the spirals</b>Coiled stone walls with a green heart at each centre, sited on the veins that feed them. Some are a single tight curl; others have coiled outward for years &mdash; tenure readable from above, the way the tally marks read on a shoulder.</figcaption></figure>
  <figure><img src="waystone-art/spiral-house.png" alt="one dwelling built around a vein" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>why it is there</b>A crack of green comes up through the ground; a curved wall of stacked stone is built around it, roofed with salvaged sheet and fern thatch. They did not build a hearth &mdash; they found one.</figcaption></figure>
  <figure><img src="waystone-art/land-source.png" alt="the volcano, the veins, the stone, the village" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the source</b>Green light from the crater, veins branching beneath the plain, the stone sitting on one with its cable plugged in, the cabins lit along the fence, two watchers with green eyes. Volcano &rarr; vein &rarr; stone &rarr; window &rarr; eye. One light, everywhere it goes.</figcaption></figure>
  <figure><img src="waystone-art/kin-green.png" alt="a resident, lit from within" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>lit from within</b>One glowing green eye and three green tally marks set into the shoulder &mdash; the same count the stone keeps. More marks, longer here.</figcaption></figure>
  <figure><img src="waystone-art/pair-v2.png" alt="the same being, before and after taking form" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the same being, twice</b>Left: formed &mdash; black, settled, ears fully curled. Right: unformed &mdash; the same creature made of light, fraying into green tendrils, hovering over a ripple. The bond ceremony needs no caption.</figcaption></figure>
  <figure><img src="waystone-art/land-volcano.png" alt="the village at the foot of a volcano" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the volcano</b>Hatched by hand, green at the crater, one green trickle down the flank &mdash; and the village tiny at its foot. Scale told by the world instead of by giant ferns.</figcaption></figure>
  <figure><img src="waystone-art/land-lake.png" alt="the village on a lake shore" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the far shore</b>Jagged mountains across still water, the settlement small on the near bank with its stone keeping count.</figcaption></figure>
  <figure><img src="waystone-art/pan-pair.png" alt="a resident and a wisp" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the two kinds</b>A formed resident, black with curled fiddlehead ears &mdash; and an unformed wisp, glowing green, hovering shy. Green is before the bond; black is after. The whole social structure of the village in two shapes.</figcaption></figure>
  <figure><img src="waystone-art/pan-tech.png" alt="cabins wearing the stone's instruments" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the village wears the stone</b>A white band, a small instrument box with a green readout by each door, one clipped cable per house running to a shared meter post. Sparing, purposeful, never decorative.</figcaption></figure>
  <figure><img src="waystone-art/pan-carry.png" alt="a being carrying a glowing card home" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the carry</b>A being hauls a card bigger than itself up the path toward two lit cabins. Precious, heavy, going home &mdash; the whole product in one small joke.</figcaption></figure>
  <figure><img src="waystone-art/pan-stone.png" alt="the waystone with tally marks" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the stone</b>Tally marks glowing foxfire green &mdash; a count, not a language &mdash; one band, one box, one cable, and a great deal of quiet.</figcaption></figure>
  <figure><img src="waystone-art/pan-village.png" alt="the village under ferns" onerror="if((this.dataset.r|0)<6){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},600*this.dataset.r)}">
    <figcaption><b>the village</b>Cabins with green windows under enormous ferns, beings on a doorstep, one small green light far down the path.</figcaption></figure>
</div>
</body></html>
