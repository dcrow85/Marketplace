<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — ink on panel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#0a0b0c}
  body{font:12.5px "IBM Plex Mono",monospace;color:#8a8378;display:grid;place-items:center;padding:22px 12px 44px}
  h1{font:italic 500 20px "Spectral",serif;color:#e8e4da;margin:0 0 4px;text-align:center}
  .sub{text-align:center;margin-bottom:20px;opacity:.75}
  .sub b{color:#ef7259;font-weight:500}
  .col{display:grid;gap:18px;max-width:1240px;width:100%}
  figure{margin:0;background:#141414;border:1px solid rgba(232,228,218,.14);border-radius:10px;padding:11px;
    box-shadow:0 14px 40px rgba(0,0,0,.6)}
  img{width:100%;display:block;border-radius:6px}
  figcaption{margin-top:10px;font:italic 500 13.5px/1.55 "Spectral",serif;color:#a49b8c}
  figcaption b{display:block;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#ef7259;letter-spacing:.08em;margin-bottom:3px}
</style></head><body>
<h1>Ink on panel</h1>
<div class="sub">pale blue-grey ground · flat black · white · one <b>coral</b> · texture by hand-hatching, never by glow</div>
<div class="col">
  <figure><img src="waystone-art/ink-village.png" alt="the village in ink">
    <figcaption><b>the village</b>Windows as flat coral rectangles &mdash; the only light in the frame. Two black silhouettes in the lane, one handing the other a small coral light. Ferns and a pine cone larger than the houses; the sky flat black.</figcaption></figure>
  <figure><img src="waystone-art/ink-stone.png" alt="the waystone in ink">
    <figcaption><b>the waystone</b>Instrument bands and housings in clean line, marks down its face in coral, one small creature looking up. Chevron mountains with coral peaks on the horizon. (The marks must become tally strokes &mdash; records, not language.)</figcaption></figure>
</div>
</body></html>
