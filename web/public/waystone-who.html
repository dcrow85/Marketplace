<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — who lives here</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#07090c}
  body{font:12.5px "IBM Plex Mono",monospace;color:#93876b;display:grid;place-items:center;padding:24px 12px 40px}
  h1{font:italic 500 19px "Spectral",serif;color:#e9dcb8;margin:0 0 4px;text-align:center}
  .sub{text-align:center;margin-bottom:20px;opacity:.8}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:1180px;width:100%}
  figure{margin:0;background:linear-gradient(172deg,#241b0f,#181209);border:1px solid rgba(210,170,100,.2);
    border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  img{width:100%;display:block;border-radius:8px}
  figcaption{margin-top:10px;font:italic 500 13px/1.5 "Spectral",serif;color:#b3a072}
  figcaption b{display:block;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#f4cd82;letter-spacing:.08em;margin-bottom:3px}
  .note{max-width:1180px;margin-top:18px;font:italic 500 13px/1.6 "Spectral",serif;color:#8a7c54;text-align:center}
</style></head><body>
<h1>Who lives here</h1>
<div class="sub">cat-sized · hands · patience · craftsmen, scholars, collectors, dreamers — internal concept</div>
<div class="row">
  <figure><img src="waystone-art/who-a.png" alt="moss-and-stone artisan">
    <figcaption><b>A · the moss-and-stone artisan</b>River-stone skin, moss at the shoulders and knuckles, apron and tool belt. The patina law walking around.</figcaption></figure>
  <figure><img src="waystone-art/who-b.png" alt="keeper with a banked ember">
    <figcaption><b>B · the keeper</b>Dark fur, great ears, and a banked ember at the chest — the light you first saw it by, still burning. Goggles pushed up, pockets full of tools.</figcaption></figure>
  <figure><img src="waystone-art/who-c.png" alt="archivist with a cabinet shell">
    <figcaption><b>C · the archivist</b>Carries its library: a hinged wooden cabinet on its back, card slots and shallow drawers. Calipers and a brush at the belt.</figcaption></figure>
</div>
<div class="note">Every one is shown beside a single sleeved card nearly as tall as it is — the scale, and the reverence, in one image.</div>
</body></html>
