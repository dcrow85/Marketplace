<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — the village at their scale</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#05070a}
  body{font:12.5px "IBM Plex Mono",monospace;color:#8a7f66;display:grid;place-items:center;padding:22px 12px 44px}
  h1{font:italic 500 20px "Spectral",serif;color:#e9dcb8;margin:0 0 4px;text-align:center}
  .sub{text-align:center;margin-bottom:20px;opacity:.75}
  .col{display:grid;gap:18px;max-width:1240px;width:100%}
  figure{margin:0;background:linear-gradient(172deg,#191308,#0d0a05);border:1px solid rgba(210,170,100,.18);
    border-radius:12px;padding:11px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
  img{width:100%;display:block;border-radius:8px}
  figcaption{margin-top:10px;font:italic 500 13.5px/1.55 "Spectral",serif;color:#b3a072}
  figcaption b{display:block;font-style:normal;font:500 11px "IBM Plex Mono",monospace;color:#f4cd82;letter-spacing:.08em;margin-bottom:3px}
</style></head><body>
<h1>The village at their scale</h1>
<div class="sub">scale told by nature · presence told by silhouette · internal concept</div>
<div class="col">
  <figure><img src="waystone-art/mini-window.png" alt="a resident holding a card up to the lamplight" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the window</b>A resident holds a single card up to the lamp — nearly as tall as it is. Ferns drip overhead, pinecones outsize the barrel, mushrooms stand shoulder-high to the door. Reverence and scale in one frame.</figcaption></figure>
  <figure><img src="waystone-art/mini-hall.png" alt="the hall doorway at night" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the hall</b>Four shapes around the stove, one at a table with an album open. Every one of them featureless, and the room still tells you everything.</figcaption></figure>
  <figure><img src="waystone-art/mini-lane.png" alt="the lane at night" onerror="if((this.dataset.r|0)<5){this.dataset.r=(this.dataset.r|0)+1;const s=this.src.split('?')[0];setTimeout(()=>{this.src=s+'?r='+this.dataset.r},700*this.dataset.r)}">
    <figcaption><b>the lane</b>A shape in a lit doorway, another on a veranda rail, two lanterns far down the mist. Fern fronds arch over the rooflines.</figcaption></figure>
</div>
</body></html>
