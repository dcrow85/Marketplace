<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystone — aesthetic test</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#07090c}
  body{font:12.5px "IBM Plex Mono",monospace;color:#93876b;overflow:hidden}
  .shot{position:fixed;inset:0;background:center/contain no-repeat;opacity:0;transition:opacity .5s ease}
  .shot.on{opacity:1}
  #a{background-image:url('waystone-art/v5-plate.png')}
  #b{background-image:url('waystone-art/v5-approach.png')}
  #c{background-image:url('waystone-art/v5-stone.png')}
  #d{background-image:url('waystone-art/v4-approach.png')}
  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;display:flex;gap:8px}
  button{font:inherit;cursor:pointer;padding:9px 18px;border-radius:7px;color:#c9b98a;
    background:linear-gradient(174deg,#3d2f1a,#2a2010);border:1px solid rgba(210,170,100,.3)}
  button.on{color:#f7e7bd;border-color:rgba(244,205,130,.55);box-shadow:0 0 16px rgba(244,205,130,.25)}
  .note{position:fixed;left:16px;top:14px;z-index:5;opacity:.75;letter-spacing:.05em}
</style></head><body>
<div class="shot on" id="a"></div><div class="shot" id="b"></div><div class="shot" id="c"></div><div class="shot" id="d"></div>
<div class="note">v0.5 — contemporary frontier craft · the stone under modern instrumentation · internal concept</div>
<div class="bar">
  <button class="on" data-s="a">the settlement</button>
  <button data-s="b">the approach</button>
  <button data-s="c">the stone</button>
  <button data-s="d">v0.4 (steampunk)</button>
</div>
<script>
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  document.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b))
  document.querySelectorAll('.shot').forEach(s => s.classList.toggle('on', s.id === b.dataset.s))
})
</script></body></html>
