<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100c">
<title>The Great Binder — every printing the village knows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a08; }
  body { overflow: hidden; font: 13px "IBM Plex Mono", ui-monospace, monospace; color: #cfc3a4; }

  /* the room behind: we're at the reading table */
  .room { position: fixed; inset: -2%; background: url('waystone-art/inn-b.png') center/cover;
    filter: blur(7px) brightness(.5) saturate(.8); transition: filter .5s ease; }
  body.regarding .room { filter: blur(12px) brightness(.28) saturate(.5); }

  .stage { position: fixed; inset: 0; display: grid; place-items: center; grid-template-rows: 1fr auto; }

  /* ── the album ── */
  .albumwrap { display: grid; place-items: center; width: 100%; padding: clamp(6px, 2vh, 22px) 8px 0; transition: filter .5s ease, opacity .5s ease; }
  body.regarding .albumwrap { filter: blur(3px) brightness(.55); }
  .album {
    position: relative; width: min(96vw, 152svh, 1180px);
    background: linear-gradient(172deg, #3d2f1e, #2a2013);
    border-radius: 14px; padding: clamp(10px, 1.6vw, 20px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(244, 205, 130, .12);
  }
  .spread { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.4vw, 18px); position: relative; }
  .spread::before { content: ""; position: absolute; left: 50%; top: -2%; bottom: -2%; width: 3px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.55), transparent); z-index: 2; }
  .page { background: linear-gradient(174deg, #e7dcc0, #d9cba8); border-radius: 6px; padding: clamp(8px, 1.2vw, 16px);
    box-shadow: inset 0 0 26px rgba(90, 70, 40, .28); }
  .pockets { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 1vw, 12px); }
  .pocket { position: relative; aspect-ratio: 5 / 7; border-radius: 5px; overflow: hidden;
    background: rgba(120, 100, 70, .18); box-shadow: inset 0 0 0 1px rgba(90, 70, 40, .25), inset 0 2px 8px rgba(60, 45, 25, .25);
    cursor: pointer; border: 0; padding: 0; }
  .pocket img { width: 100%; height: 100%; object-fit: contain; display: block;
    filter: saturate(.92) brightness(.97); transition: filter .25s ease, transform .25s ease; }
  .pocket.landscape img { transform: rotate(90deg) scale(1.38); }
  .pocket:hover img { filter: saturate(1.05) brightness(1.04); }
  .pocket.landscape:hover img { transform: rotate(90deg) scale(1.41); }
  /* sleeve sheen: it lives in plastic, like it should */
  .pocket::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 26%); }
  .pocket.empty { cursor: default; background: rgba(120, 100, 70, .08); box-shadow: inset 0 0 0 1.5px rgba(90, 70, 40, .2); }
  .plabel { font: italic 500 clamp(7.5px, .82vw, 11px)/1.2 "Spectral", serif; color: #5d4c30;
    text-align: center; padding-top: 3px; min-height: 1.5em; }

  /* page furniture */
  .albumbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px 0; }
  .albumbar .ek { font: italic 600 clamp(13px, 1.5vw, 17px) "Spectral", serif; color: #e9dcb8; }
  .albumbar .ek span { font: 500 11px "IBM Plex Mono", monospace; color: #93876b; font-style: normal; margin-left: 8px; }
  .turns { display: flex; align-items: center; gap: 8px; }
  .turn { font: inherit; background: rgba(233, 220, 184, .1); color: #e9dcb8; border: 1px solid rgba(233, 220, 184, .25);
    border-radius: 7px; padding: 5px 13px; cursor: pointer; }
  .turn:hover { background: rgba(233, 220, 184, .18); }
  .turn:disabled { opacity: .3; cursor: default; }
  .where { color: #93876b; font-size: 11.5px; min-width: 11ch; text-align: center; }
  .seek { display: flex; align-items: center; gap: 6px; }
  .seek input { font: inherit; font-size: 12px; width: clamp(120px, 16vw, 210px); background: rgba(233, 220, 184, .08);
    border: 1px solid rgba(233, 220, 184, .2); border-radius: 7px; padding: 5px 9px; color: #e9dcb8; }
  .seek input::placeholder { color: #93876b; }

  /* ── the regard ── */
  .lens { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; }
  body.regarding .lens { display: grid; }
  .lens .card { width: min(34vh, 78vw); border-radius: 10px; cursor: pointer;
    box-shadow: 0 30px 90px rgba(0, 0, 0, .75), 0 0 60px rgba(244, 205, 130, .35), 0 0 140px rgba(232, 180, 90, .15);
    filter: saturate(1.14) brightness(1.05); animation: bloom .45s cubic-bezier(.22, .9, .3, 1); }
  .lens .card.landscape { width: min(52vh, 88vw); }
  @keyframes bloom { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .facts { margin-top: 14px; text-align: center; max-width: min(560px, 88vw); }
  .facts h2 { font: 600 clamp(17px, 2.2vw, 23px)/1.25 "Spectral", serif; color: #efe6cc; margin: 0; }
  .facts .ja { font: 500 12.5px "Spectral", serif; color: #a99c7d; margin-top: 2px; }
  .facts .meta { font-size: 11.5px; color: #b3a687; margin-top: 8px; }
  .facts .meta b { color: #e8b45a; font-weight: 500; }
  .facts .flavor { font: italic 500 13px/1.5 "Spectral", serif; color: #8f8468; margin-top: 8px; }
  .facts .honest { font-size: 10px; color: #6e6752; margin-top: 10px; letter-spacing: .05em; }

  /* ── the dock: plain words, ease first ── */
  .dock { display: flex; gap: 6px; justify-content: center; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); z-index: 20; }
  .dock a, .dock span { font: 500 12.5px "IBM Plex Mono", monospace; text-decoration: none;
    padding: 8px 16px; border-radius: 9px; letter-spacing: .02em; }
  .dock .on { background: rgba(244, 205, 130, .14); color: #f4cd82; border: 1px solid rgba(244, 205, 130, .3); }
  .dock span { color: #6e6752; border: 1px solid rgba(147, 135, 107, .15); }
  .dock span i { font-style: normal; font-size: 9.5px; opacity: .7; margin-left: 5px; }

  /* the wisp keeps you company at the table */
  .wisp { position: fixed; z-index: 25; width: 10px; height: 10px; border-radius: 50%; left: 8%; top: 12%;
    background: #fff3cf; pointer-events: none;
    box-shadow: 0 0 14px 5px rgba(244, 205, 130, .6), 0 0 36px 12px rgba(232, 180, 90, .22);
    animation: wispidle 9s ease-in-out infinite alternate; }
  @keyframes wispidle {
    0% { transform: translate(0, 0); } 30% { transform: translate(24px, 30px); }
    60% { transform: translate(-12px, 54px); } 100% { transform: translate(30px, 12px); }
  }

  @media (max-width: 760px) {
    .spread { grid-template-columns: 1fr; }
    .spread::before { display: none; }
    .page.right { display: none; }
    .albumbar { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .wisp { animation: none; } .lens .card { animation: none; } }
</style>
</head>
<body>
<div class="room"></div>
<div class="wisp"></div>
<div class="stage">
  <div class="albumwrap">
    <div class="album">
      <div class="spread">
        <div class="page left"><div class="pockets" id="pgL"></div></div>
        <div class="page right"><div class="pockets" id="pgR"></div></div>
      </div>
      <div class="albumbar">
        <div class="ek">The Great Binder <span id="setname"></span></div>
        <div class="seek"><input id="seek" placeholder="find a card by name…" autocomplete="off"></div>
        <div class="turns">
          <button class="turn" id="prev">&#8249; back</button>
          <div class="where" id="where">…</div>
          <button class="turn" id="next">turn &#8250;</button>
        </div>
      </div>
    </div>
  </div>
  <nav class="dock">
    <a class="on" href="#">Catalogue</a>
    <span>My Binder<i>soon</i></span>
    <span>Shops<i>soon</i></span>
    <span>Market<i>soon</i></span>
  </nav>
</div>

<div class="lens" id="lens">
  <div>
    <img class="card" id="lensCard" src="" alt="">
    <div class="facts">
      <h2 id="fName"></h2>
      <div class="ja" id="fJa"></div>
      <div class="meta" id="fMeta"></div>
      <div class="flavor" id="fFlavor"></div>
      <div class="honest">catalogue reference — never proof of a seller&#8217;s physical copy · imagery courtesy of Palify, with permission</div>
    </div>
  </div>
</div>

<script>
const PER = 9
let cards = [], spread = 0, isNarrow = matchMedia('(max-width: 760px)').matches
const perView = () => isNarrow ? PER : PER * 2
const $ = (id) => document.getElementById(id)

fetch('catalogs/palworld-ocg.json').then((r) => r.json()).then((d) => {
  cards = d.cards.filter((c) => c.image)
  $('setname').textContent = '· ' + (cards[0]?.release_family_label || 'Palworld OCG') + ' · ' + cards.length + ' printings'
  render()
})

function pocket(c) {
  if (!c) { const e = document.createElement('div'); e.className = 'pocket empty'; return [e, ''] }
  const b = document.createElement('button')
  b.className = 'pocket' + (c.landscape === 'True' ? ' landscape' : '')
  b.title = c.name_en
  const img = document.createElement('img')
  img.loading = 'lazy'; img.src = c.image; img.alt = c.name_en
  b.appendChild(b.img = img)
  b.addEventListener('click', () => regard(c))
  return [b, (c.printing_code || '') + ' · ' + (c.rarity || '')]
}

function render() {
  const start = spread * perView()
  const fill = (el, from) => {
    el.innerHTML = ''
    for (let i = 0; i < PER; i++) {
      const c = cards[from + i]
      const [p, label] = pocket(c)
      const cell = document.createElement('div')
      cell.appendChild(p)
      const l = document.createElement('div'); l.className = 'plabel'; l.textContent = label
      cell.appendChild(l)
      el.appendChild(cell)
    }
  }
  fill($('pgL'), start)
  if (!isNarrow) fill($('pgR'), start + PER)
  const total = Math.ceil(cards.length / perView())
  $('where').textContent = 'spread ' + (spread + 1) + ' of ' + total
  $('prev').disabled = spread === 0
  $('next').disabled = spread >= total - 1
}

const turn = (d) => { spread = Math.max(0, Math.min(Math.ceil(cards.length / perView()) - 1, spread + d)); render() }
$('prev').addEventListener('click', () => turn(-1))
$('next').addEventListener('click', () => turn(1))
window.addEventListener('keydown', (e) => {
  if (document.body.classList.contains('regarding')) { if (e.key === 'Escape') unregard(); return }
  if (e.key === 'ArrowLeft') turn(-1)
  if (e.key === 'ArrowRight') turn(1)
})
let tx = null
window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX })
window.addEventListener('touchend', (e) => {
  if (tx == null) return
  const dx = e.changedTouches[0].clientX - tx
  if (Math.abs(dx) > 60 && !document.body.classList.contains('regarding')) turn(dx < 0 ? 1 : -1)
  tx = null
})
$('seek').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase()
  if (q.length < 2) return
  const i = cards.findIndex((c) => (c.name_en || '').toLowerCase().includes(q))
  if (i >= 0) { spread = Math.floor(i / perView()); render() }
})

function regard(c) {
  const img = $('lensCard')
  img.src = c.image; img.alt = c.name_en
  img.className = 'card' + (c.landscape === 'True' ? ' landscape' : '')
  $('fName').textContent = c.name_en
  $('fJa').textContent = c.name_ja !== c.name_en ? (c.name_ja || '') : ''
  const fam = Number(c.printing_family_size || 1)
  $('fMeta').innerHTML = '<b>' + (c.printing_code || '') + '</b> · ' + (c.rarity || '') + ' · ' + (c.category || '')
    + (fam > 1 ? ' · one of <b>' + fam + '</b> printings of this card' : ' · the only printing')
  $('fFlavor').textContent = c.flavor_text || ''
  document.body.classList.add('regarding')
}
const unregard = () => document.body.classList.remove('regarding')
$('lens').addEventListener('click', unregard)

matchMedia('(max-width: 760px)').addEventListener('change', (m) => { isNarrow = m.matches; spread = 0; render() })
</script>
</body>
</html>
